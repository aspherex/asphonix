name: Feature request
description: Suggest an idea or improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the use case, not only the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Playback / audio output
        - Library / browsing / search
        - Playlists / ratings
        - Now Playing
        - Queue / Flow / autoplay
        - OS integration
        - UI / theme
        - Other
  - type: checkboxes
    attributes:
      label: Server support
      options:
        - label: This needs something from the server (a Navidrome feature or an OpenSubsonic extension).
