# Extended test runs, informational (not a merge gate; the gate is build.yml):
# - coverage: cargo-llvm-cov over the workspace on Windows, lcov + summary uploaded as an artifact and shown in the run
#   summary. Needs no secrets (nothing is uploaded to a coverage service).
# - deep-random: the randomized tests with many more seeds/cases than the regular run (docs/TESTING.md). A failure
#   prints its seed; replay it locally with SEED=<n> (GPUI) or the committed proptest-regressions file.
name: Tests (extended)

on:
  push:
    branches: [main, master]
    paths-ignore: ["**.md", "docs/**"]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-extended-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  coverage:
    name: coverage (informational)
    runs-on: windows-latest
    timeout-minutes: 90
    continue-on-error: true
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: "1.100.0" # keep in sync with rust-toolchain.toml
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --version 0.9.2 --locked
      - name: Coverage
        env:
          ASPHONIX_TEST_TMP: ${{ runner.temp }}
        run: |
          cargo llvm-cov --workspace --locked --lcov --output-path lcov.info
          cargo llvm-cov report --summary-only | tee coverage-summary.txt
          { echo '### Coverage (informational)'; echo '```'; cat coverage-summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: |
            lcov.info
            coverage-summary.txt
          if-no-files-found: error

  deep-random:
    name: randomized tests, many seeds
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: "1.100.0" # keep in sync with rust-toolchain.toml
      - uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1
      - name: GPUI tests, 300 seeds each
        env:
          ITERATIONS: "300"
        run: cargo test -p asphonix-ui --locked gpui_tests
      - name: Property tests, 4096 cases each
        env:
          PROPTEST_CASES: "4096"
        run: cargo test -p asphonix-core --locked --test queue_props --test abloop_props && cargo test -p asphonix-core --locked --lib prop_tests
