# Lint, test and build ASPHONIX on Windows, macOS and Linux.
# Every push to main / pull request: clippy + tests + release build, binaries attached to the run as artifacts.
# A pushed tag `v*` additionally publishes the archives as a GitHub release (draft, so notes can be edited first).
#
# The binaries are unsigned: Windows SmartScreen and macOS Gatekeeper warn on first launch
# (macOS: right-click -> Open, or `xattr -dr com.apple.quarantine ASPHONIX.app`).
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
          - name: macos-arm64
            os: macos-15
          - name: linux-x64
            os: ubuntu-24.04
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      # Third-party actions pinned to commit SHAs.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: clippy

      - uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1

      - name: Linux system libraries (GPUI, ALSA, D-Bus)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev libdbus-1-dev libfontconfig1-dev libfreetype6-dev \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libx11-xcb-dev libxcb1-dev \
            libvulkan-dev libzstd-dev

      # macOS and Linux are newer targets: their lint/test failures are reported but do not block the build
      # artifacts yet. Drop the continue-on-error once both are green.
      - name: Clippy
        continue-on-error: ${{ runner.os != 'Windows' }}
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Tests
        continue-on-error: ${{ runner.os != 'Windows' }}
        # short temp root: Unix socket paths are limited to ~104 bytes on macOS
        env:
          ASPHONIX_TEST_TMP: ${{ runner.os != 'Windows' && '/tmp/sx' || runner.temp }}
        run: |
          if [[ -n "${ASPHONIX_TEST_TMP:-}" ]]; then mkdir -p "$ASPHONIX_TEST_TMP"; fi
          cargo test --workspace --locked

      - name: Release build
        run: cargo build --workspace --release --locked

      - name: Package
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF_TYPE" == tag ]] || ver="$(git rev-parse --short HEAD)"
          out="asphonix-${ver}-${{ matrix.name }}"
          mkdir -p dist
          case "$RUNNER_OS" in
            Windows)
              mkdir "$out"
              cp target/release/asphonix.exe target/release/asphonix-mcp.exe LICENSE README.md "$out/"
              7z a "dist/$out.zip" "$out" >/dev/null
              ;;
            macOS)
              app="$out/ASPHONIX.app"
              mkdir -p "$app/Contents/MacOS"
              cp target/release/asphonix target/release/asphonix-mcp "$app/Contents/MacOS/"
              cat > "$app/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>ASPHONIX</string>
            <key>CFBundleDisplayName</key><string>ASPHONIX</string>
            <key>CFBundleIdentifier</key><string>dev.asphonix.app</string>
            <key>CFBundleExecutable</key><string>asphonix</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${ver}</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          PLIST
              cp LICENSE README.md "$out/"
              # Ad-hoc signature only (Apple Silicon refuses unsigned binaries); no Developer ID, no notarization.
              codesign --force --deep -s - "$app"
              hdiutil create -volname ASPHONIX -srcfolder "$out" -ov -format UDZO "dist/$out.dmg"
              ;;
            Linux)
              mkdir "$out"
              cp target/release/asphonix target/release/asphonix-mcp LICENSE README.md "$out/"
              tar -czf "dist/$out.tar.gz" "$out"
              ;;
          esac
          ls -l dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: asphonix-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          draft: true
          generate_release_notes: true
          files: dist/*
