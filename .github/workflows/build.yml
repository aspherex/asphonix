# Checks and tests on every push to main / every pull request. The Linux clippy + test jobs are the fast signal
# (target ~3 minutes with a warm cache); Windows (2-3x slower runners), macOS and cargo-deny run in parallel.
# Release builds and installers: .github/workflows/release.yml. Long randomized runs: tests-extended.yml (nightly).
#
# How it stays fast:
# - every job does one thing and they all run in parallel: clippy (Linux + Windows, each platform has code the
#   other does not compile), tests (Windows = primary platform, Linux = the cpal/ALSA path), macOS type-check
# - dependency artifacts are cached per job (rust-cache; on macOS actions/cache directly, rust-cache saves empty
#   archives there); only our own crates are rebuilt
# - no debug info and no incremental state in CI builds (smaller, faster to link and to cache)
# - no release build here (that is the release pipeline's job)
# Not used: sccache with the GitHub cache backend (one cache entry per compiled crate gets throttled - 187 failed
# writes in one run - and its wrapper broke rust-cache's fingerprints; on Windows it fails on gpui's command line).
name: Build

on:
  push:
    branches: [main, master]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  LINUX_PKGS: >-
    pkg-config libasound2-dev libdbus-1-dev libfontconfig1-dev libfreetype6-dev libwayland-dev libxkbcommon-dev
    libxkbcommon-x11-dev libx11-xcb-dev libxcb1-dev libvulkan-dev libzstd-dev

jobs:
  deny:
    name: cargo-deny
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
        with:
          command: check

  clippy:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    name: clippy ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - if: runner.os == 'Linux'
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: ${{ env.LINUX_PKGS }}
          version: gpui-1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: "1.100.0" # keep in sync with rust-toolchain.toml
          components: clippy
      - uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1
        with:
          cache-on-failure: true
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    name: test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - if: runner.os == 'Linux'
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: ${{ env.LINUX_PKGS }}
          version: gpui-1
      - name: Secret Service for the keychain tests (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y -qq --no-install-recommends gnome-keyring >/dev/null
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: "1.100.0" # keep in sync with rust-toolchain.toml
      - uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1
        with:
          cache-on-failure: true
      - name: Tests
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            # temp dirs stay under /tmp here: the MCP bridge's Unix socket path must fit SUN_LEN (108 bytes)
            # a session bus with an unlocked gnome-keyring, so the Secret Service (keyring crate) works headless
            dbus-run-session -- bash -c 'echo -n ci | gnome-keyring-daemon --unlock --components=secrets >/dev/null && cargo test --workspace --locked'
          else
            export ASPHONIX_TEST_TMP="$RUNNER_TEMP"
            cargo test --workspace --locked
          fi

  check-macos:
    name: check macos-15
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: "1.100.0" # keep in sync with rust-toolchain.toml
      # actions/cache instead of rust-cache: rust-cache stores empty archives on the macOS runners (0 MB, every run)
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: check-macos-1.100.0-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: check-macos-1.100.0-${{ hashFiles('Cargo.lock') }}-
      - run: cargo check --workspace --all-targets --locked
