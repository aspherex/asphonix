[workspace]
resolver = "2"
members = ["crates/asphonix-api", "crates/asphonix-core", "crates/asphonix-real", "crates/asphonix-ui", "crates/asphonix-mcp"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"
repository = "https://github.com/aspherex/asphonix"
description = "Bit-perfect desktop music player for Navidrome/Subsonic servers"

[workspace.dependencies]
gpui = "=0.2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

# quick iteration only; all reported numbers come from `release`
[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
strip = false
panic = "abort"

# release code with symbols, for crash analysis (`--profile relsym`)
[profile.relsym]
inherits = "release"
debug = true
strip = false

