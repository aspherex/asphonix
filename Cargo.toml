[workspace]
resolver = "2"
members = ["crates/sonix-api", "crates/sonix-core", "crates/sonix-real", "crates/sonix-ui", "crates/sonix-mcp", "crates/sonix-mcp-protocol", "crates/sonix-logging"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"
repository = "https://github.com/aspherex/sonix"
description = "Bit-perfect desktop music player for Navidrome/Subsonic servers"

[workspace.dependencies]
gpui = "=0.2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = "1"
log = "0.4"
tracing = "0.1.44"
# no `fmt`/`ansi`: sonix-logging writes its own JSON lines
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["std", "registry", "env-filter", "smallvec"] }
tracing-appender = "0.2.5"
tracing-log = { version = "0.2.0", default-features = false, features = ["std", "log-tracer"] }
time = "0.3"
rand = "0.8"
chrono = "0.4"
url = "2"
image = { version = "0.25.1", default-features = false }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

# quick iteration only; all reported numbers come from `release`
[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
strip = false
panic = "abort"

# release code with symbols, for crash analysis (`--profile relsym`)
[profile.relsym]
inherits = "release"
debug = true
strip = false


[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"
