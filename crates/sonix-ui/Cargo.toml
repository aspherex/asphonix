[package]
name = "sonix-ui"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "sonix"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
sonix-api = { path = "../sonix-api" }
sonix-real = { path = "../sonix-real" }
gpui.workspace = true
serde.workspace = true
serde_json.workspace = true
futures = "0.3"
unicode-segmentation = "1"
raw-window-handle = "0.6"
log.workspace = true
image = { workspace = true, features = ["png"] }

[features]
# Heap accounting for memory work (counting allocator + big-allocation backtraces). Never in a release build.
memprof = []

[build-dependencies]
embed-resource = "3"
