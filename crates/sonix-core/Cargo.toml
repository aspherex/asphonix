[package]
name = "sonix-core"
version.workspace = true
edition = "2021"
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "fs", "net"] }
log = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "gzip", "rustls-tls", "stream"] }
url = "2"
md-5 = "0.10"
rand = { version = "0.8", features = ["small_rng"] }
keyring = "3"
futures-util = "0.3"
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
symphonia = { version = "0.5.5", features = ["flac", "wav", "aiff", "mp3", "isomp4", "aac", "vorbis", "alac", "pcm"] }
rtrb = "0.4"
realfft = "3.5"
tempfile = "3"

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
wasapi = "0.25"
windows = { version = "0.62", features = ["Win32_Media_Audio", "Win32_System_Threading", "Win32_Foundation"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(not(windows))'.dependencies]
cpal = "0.15"
