[package]
name = "sonix-core"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror = "1"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "sync", "fs", "net"] }
tracing.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json", "gzip", "rustls-tls", "stream"] }
url.workspace = true
md-5 = "0.10"
rand = { workspace = true, features = ["small_rng"] }
keyring = "3"
futures-util = "0.3"
rusqlite = { version = "0.43", features = ["bundled"] }
chrono = { workspace = true, features = ["serde"] }
symphonia = { version = "0.5.5", features = ["flac", "wav", "aiff", "mp3", "isomp4", "aac", "vorbis", "alac", "pcm"] }
rtrb = "0.4"
realfft = "3.5"
tempfile = "3"
semver = "1"
base64 = "0.22"
minisign-verify = "0.3"
sonix-mcp-protocol = { path = "../sonix-mcp-protocol" }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
wasapi = "0.25"
windows = { version = "0.62", features = ["Win32_Media_Audio", "Win32_System_Threading", "Win32_Foundation", "Foundation", "Media", "Storage_Streams", "Win32_System_WinRT", "Win32_Security", "Win32_Security_Authorization", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader", "Win32_UI_Shell"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Secret Service (GNOME Keyring / KWallet) over D-Bus; pure-Rust crypto.
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

[target.'cfg(not(windows))'.dependencies]
cpal = "0.15"

[dev-dependencies]
sonix-mcp = { path = "../sonix-mcp" }
sonix-logging = { path = "../sonix-logging", features = ["test-support"] }
minisign = "0.7"
proptest.workspace = true
# virtual time (`#[tokio::test(start_paused = true)]`) for timeout tests
tokio = { workspace = true, features = ["test-util", "macros", "rt", "io-util"] }
