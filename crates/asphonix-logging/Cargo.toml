[package]
name = "asphonix-logging"
version.workspace = true
description = "Structured JSON-lines logging for the ASPHONIX binaries (subscriber, rotation, runtime verbosity)"
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

# Libraries only emit `tracing` events; the binary (`asphonix`) calls `asphonix_logging::init`.
# No GPUI, no asphonix-* dependencies: the caller passes the log directory.

[lints]
workspace = true

[features]
# `test_support::capture()`: in-memory capture of the JSON lines, for other crates' tests.
test-support = []

[dependencies]
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
tracing-log.workspace = true
log.workspace = true
serde_json.workspace = true
time.workspace = true
