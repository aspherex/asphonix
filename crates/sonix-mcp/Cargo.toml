[package]
name = "sonix-mcp"
version.workspace = true
description = "MCP (Model Context Protocol) stdio bridge to a running SONIX app"
edition = "2021"
publish.workspace = true
license.workspace = true
repository.workspace = true

# The app side of the bridge is `sonix-core/src/mcp_bridge`.

[lib]
name = "sonix_mcp"
path = "src/lib.rs"

[[bin]]
name = "sonix-mcp"
path = "src/main.rs"

[dependencies]
serde_json = "1"
sha2 = "0.10"
getrandom = "0.2"
