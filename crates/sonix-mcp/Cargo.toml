[package]
name = "sonix-mcp"
version.workspace = true
description = "MCP (Model Context Protocol) stdio bridge to a running SONIX app"
edition = "2021"
publish.workspace = true

# Vendored from SoniX tools/sonix-mcp @ 642db10 (see ../sonix-core/VENDORED.md); the app side is
# `sonix-core/src/mcp_bridge`. Only change: APP_IDENTIFIER = dev.sonix.native.

[lib]
name = "sonix_mcp"
path = "src/lib.rs"

[[bin]]
name = "sonix-mcp"
path = "src/main.rs"

[dependencies]
serde_json = "1"
sha2 = "0.10"
getrandom = "0.2"
