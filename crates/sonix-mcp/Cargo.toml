[package]
name = "sonix-mcp"
version.workspace = true
description = "MCP (Model Context Protocol) stdio bridge to a running SONIX app"
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

# The app side of the bridge is `sonix-core/src/mcp_bridge`.

[lib]
name = "sonix_mcp"
path = "src/lib.rs"

[[bin]]
name = "sonix-mcp"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
serde_json.workspace = true
sonix-mcp-protocol = { path = "../sonix-mcp-protocol" }
sonix-logging = { path = "../sonix-logging" }
tracing.workspace = true

[dev-dependencies]
insta.workspace = true
